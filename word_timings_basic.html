<!DOCTYPE html>
<html>
<head>
  <title>Basic Camera Movement - "If you want to sell online"</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #animation-container {
      position: relative;
      width: auto;
      height: 95vh;
      max-width: calc(95vh * (9 / 16));
      aspect-ratio: 9 / 16;
      border: 2px solid #555;
      overflow: hidden;
      background-color: #000;
    }

    canvas { display: block; width: 100%; height: 100%; }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1.5em;
      font-family: sans-serif;
      z-index: 20;
      text-align: center;
      background-color: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 10px;
    }

    /* --- DEBUG PANEL STYLES --- */
    #debug-panel {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 240px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 8px;
      font-family: sans-serif;
      z-index: 40; /* display: none;  toggle if needed */
    }

    #timeline-scrubber { width: 100%; }
    #progress-display { text-align: center; font-size: 0.8em; margin-top: 4px; }
    #ease-graph { display: block; margin-top: 6px; background: #222; }
    #ease-name { text-align: center; font-size: 0.75em; margin-top: 4px; }

    /********  deterministic-mode overrides  ********/
    body.deterministic-mode #animation-container {
      width: 1080px !important;
      height: 1920px !important;
      max-width: 1080px !important;
      border: none !important;
    }
    body.deterministic-mode {
      display: block;
    }

    body.deterministic-mode #debug-panel,
    body.deterministic-mode .lil-gui.root {
      display: none !important;
    }

    /* --- CAMERA PANEL SPECIFIC STYLES --- */
    .lil-gui.root { /* General lil-gui, ensure it can be positioned */
      position: fixed !important; /* Use important if needed to override defaults */
    }
    /* Target the camera panel more specifically if it gets a unique class,
       or rely on the JS positioning. For now, the JS sets left:0. */
  </style>

  <!-- ────────────────────────────────────────────── -->
  <!--              IMPORT-MAP (browser)             -->
  <!-- ────────────────────────────────────────────── -->
  <script type="importmap">
    {
      "imports": {
        "three"                           : "/node_modules/three/build/three.module.js",
        "three/addons/"                   : "/node_modules/three/examples/jsm/",
        "gsap"                            : "/node_modules/gsap/index.js",
        "troika-three-text"               : "/node_modules/troika-three-text/dist/troika-three-text.esm.js",
        "troika-worker-utils"             : "/node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",
        "troika-three-utils"              : "/node_modules/troika-three-utils/dist/troika-three-utils.esm.js",
        "webgl-sdf-generator"             : "./node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
        "bidi-js"                         : "/node_modules/bidi-js/dist/bidi.mjs",
        "motion-blur/"                    : "./threejs-sandbox/motionBlurPass/src/",
        "scene-helpers"                   : "./scene-helpers.js",
        "custom_ease_charles"             : "./src/utils/custom_ease_charles.js",

        "scene_config"                    : "./src/config/sceneSequenceConfig.js",
        "text_library_config"             : "./src/config/textLibraryConfig.js",
        "asset_library_config"            : "./src/config/assetLibraryConfig.js",

        "scene_content_factory"           : "./src/utils/sceneContentFactory.js",
        "occlusion_fixer"                 : "./src/utils/occlusion_fixer.js",
        "overlap_needed"                  : "./src/utils/overlapNeeded.js",

        "gaussian_blur_shader"            : "./src/shaders/gaussianBlurShader.js",
        "four_corner_gradient_shader"     : "./src/shaders/fourCornerGradientShader.js",
        "circular_wipe_shader"            : "./src/shaders/circularWipeShader.js",

        "transcript_utils"                : "./src/utils/transcriptUtils.js",

        "initialize_core_three_objects"   : "./src/init/initializeCoreThreeObjects.js",
        "load_transcript_data"            : "./src/init/loadTranscriptData.js",
        "create_scene_anchors"            : "./src/init/createSceneAnchors.js",
        "create_content_from_config"      : "./src/init/createContentFromConfig.js",
        "setup_post_processing"           : "./src/init/setupPostProcessing.js",
        "setup_lighting"                  : "./src/init/setupLighting.js",
        "setup_camera_rig"                : "./src/init/setupCameraRig.js",
        "calculate_scene_durations"       : "./src/init/calculateSceneDurations.js",
        "timeline_builder"                : "./src/animation/timelineBuilder.js"
      }
    }
  </script>
</head>

<body>
  <!-- ────────────────────────────────────────────── -->
  <!--            MAIN VIEWPORT / CANVAS             -->
  <!-- ────────────────────────────────────────────── -->
  <div id="animation-container">
    <div id="loading">Loading Assets…<br><span id="loading-progress"></span></div>
  </div>

  <!-- ─────────── DEBUG SCRUB PANEL ─────────── -->
  <div id="debug-panel">
    <input type="range" id="timeline-scrubber" min="0" max="100" step="1" value="0" />
    <div style="display:flex; gap:6px; align-items:center; margin-top:4px">
      <button id="btn-play"  title="Play">▶</button>
      <button id="btn-pause" title="Pause" disabled>❚❚</button>
      <span   id="time-display">0.00 s (f0)</span>
    </div>
    <canvas id="ease-graph" width="200" height="120"></canvas>
    <div id="ease-name">Ease: -</div>
    <div id="sword-debug" style="margin-top: 10px; font-family: monospace; font-size: 12px; color: #88ff88;"></div>
  </div>

  <!-- ────────────────────────────────────────────── -->
  <!--             APPLICATION BOOTSTRAP              -->
  <!-- ────────────────────────────────────────────── -->
  <!--  Placed at the very end so #animation-container exists -->
  <!--  APPLICATION BOOTSTRAP  (now via HMR orchestrator) -->
  <script type="module" src="/src/dev/hmrOrchestrator.js"></script>
</body>
</html>
